name: Build TWRP (PBEM00)

# 预填 OPPO R17 PBEM00 / ColorOS10 设备树
# Actions → Build TWRP (PBEM00) → Run workflow
# 成功后在 Releases 下载 recovery.img；先用 fastboot boot 试启，勿直接 flash

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "TWRP 源码 manifest URL"
        required: true
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni"
      MANIFEST_BRANCH:
        description: "manifest 分支（10.0 已标记 deprecated，但仍可用）"
        required: true
        default: "twrp-10.0-deprecated"
      DEVICE_TREE_URL:
        description: "设备树仓库"
        required: true
        default: "https://github.com/AmeChanRain/android_device_oppo_PBEM00"
      DEVICE_TREE_BRANCH:
        description: "设备树分支"
        required: true
        default: "twrp-10"
      DEVICE_PATH:
        description: "源码内设备路径"
        required: true
        default: "device/oppo/PBEM00"
      DEVICE_NAME:
        description: "产品目录名 / out 目录名"
        required: true
        default: "PBEM00"
      MAKEFILE_NAME:
        description: "lunch 用 makefile 名（不含 -eng）"
        required: true
        default: "omni_PBEM00"
      BUILD_TARGET:
        description: "编译目标：recovery 或 boot"
        required: true
        default: "recovery"

jobs:
  build:
    # 仅仓库所有者可触发，避免被 fork 滥用分钟数
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Show parameters
        run: |
          echo "Manifest: ${{ github.event.inputs.MANIFEST_URL }} @ ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device tree: ${{ github.event.inputs.DEVICE_TREE_URL }} @ ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Path: ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Lunch: ${{ github.event.inputs.MAKEFILE_NAME }}-eng"
          echo "Target: ${{ github.event.inputs.BUILD_TARGET }}image"

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5 libncurses5-dev lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python-is-python3 schedtool libssl-dev \
            bc rsync imagemagick lzop pngcrush libxml2 ccache

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install repo
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo

      - name: Set swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Init workspace
        id: ws
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          echo "dir=$GITHUB_WORKSPACE/workspace" >> "$GITHUB_OUTPUT"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global color.ui false

      - name: repo init
        working-directory: ${{ steps.ws.outputs.dir }}
        run: |
          repo init --depth=1 \
            -u "${{ github.event.inputs.MANIFEST_URL }}" \
            -b "${{ github.event.inputs.MANIFEST_BRANCH }}"

      - name: repo sync
        working-directory: ${{ steps.ws.outputs.dir }}
        run: |
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Clone device tree
        working-directory: ${{ steps.ws.outputs.dir }}
        run: |
          rm -rf "${{ github.event.inputs.DEVICE_PATH }}"
          git clone --depth=1 \
            -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
            "${{ github.event.inputs.DEVICE_TREE_URL }}" \
            "${{ github.event.inputs.DEVICE_PATH }}"
          ls -la "${{ github.event.inputs.DEVICE_PATH }}"

      - name: Build recovery
        working-directory: ${{ steps.ws.outputs.dir }}
        run: |
          set -e
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          # Omni/TWRP10 时代部分脚本仍假设 python2；没有则用 python3 顶上
          if ! command -v python2 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python2 || true
          fi
          source build/envsetup.sh
          lunch "${{ github.event.inputs.MAKEFILE_NAME }}-eng"
          mka "${{ github.event.inputs.BUILD_TARGET }}image" -j$(nproc)

      - name: Collect artifacts
        id: out
        working-directory: ${{ steps.ws.outputs.dir }}
        run: |
          OUT="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          IMG="$OUT/${{ github.event.inputs.BUILD_TARGET }}.img"
          test -f "$IMG"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -v "$IMG" "$GITHUB_WORKSPACE/artifacts/PBEM00-${{ github.event.inputs.BUILD_TARGET }}-${{ github.run_id }}.img"
          ls -lh "$GITHUB_WORKSPACE/artifacts"
          sha256sum "$GITHUB_WORKSPACE/artifacts/"*.img | tee "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"
          echo "img=PBEM00-${{ github.event.inputs.BUILD_TARGET }}-${{ github.run_id }}.img" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PBEM00-twrp-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pbem00-twrp-${{ github.run_id }}
          name: PBEM00 TWRP ${{ github.run_id }}
          body: |
            非官方 TWRP（云编译）
            - Device: OPPO R17 (PBEM00)
            - Manifest: `${{ github.event.inputs.MANIFEST_BRANCH }}`
            - Device tree: `${{ github.event.inputs.DEVICE_TREE_URL }}` @ `${{ github.event.inputs.DEVICE_TREE_BRANCH }}`
            - Target: `${{ github.event.inputs.BUILD_TARGET }}.img`

            **请先 `fastboot boot` 试启动，确认能进 REC 后再考虑 `fastboot flash recovery`。**
            本包未针对 ColorOS F.29 做过机实测。
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
